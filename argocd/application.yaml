apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: habitapp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/chandrakumarc11/HabitApp.git
    targetRevision: main
    path: helm/habitapp

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: habitapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
